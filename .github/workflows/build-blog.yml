name: Construir blog

# Se ejecuta solo cuando el editor sube o cambia una entrada o una imagen.
# NO se ejecuta con los archivos que el propio generador crea (index.html, feed.xml, p/),
# para evitar que se dispare en bucle.
on:
  push:
    branches: [ main ]
    paths:
      - 'blog/posts/**'
      - 'blog/img/**'
      - 'blog/_generator/**'
      - '.github/workflows/build-blog.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: construir-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del generador
        working-directory: blog/_generator
        run: npm install --no-audit --no-fund

      - name: Generar el blog
        working-directory: blog/_generator
        run: node build.js

      - name: Publicar los cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/index.html blog/feed.xml blog/p
          if git diff --staged --quiet; then
            echo "No hubo cambios que publicar."
          else
            git commit -m "Actualizar blog automaticamente"
            git push
          fi
